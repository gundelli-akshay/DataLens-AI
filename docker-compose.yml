services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datalens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - UPLOAD_DIR=/app/data/uploads
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-20}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/datalens.db}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-datalens-dev-super-secret-jwt-key-32-chars-minimum!}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost
    volumes:
      - datalens_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datalens-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  datalens_data:
    driver: local
